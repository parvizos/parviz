services:
  parviz:
    build: .
    container_name: parviz
    ports:
      - "3000:3000"
    environment:
      # Задай свои значения в .env рядом с этим файлом (или в окружении).
      - APP_PASSWORD=${APP_PASSWORD:-parviz}
      - AUTH_SECRET=${AUTH_SECRET:-change-me-to-a-long-random-string}
      - DATABASE_URL=file:./data/parviz.db
      - APP_TIMEZONE=${APP_TIMEZONE:-Europe/Moscow}
      # Объектное хранилище для медиа (S3-совместимое, напр. Oracle Object
      # Storage). Заданы все пять — новые треки туда; пусто — на диск.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
